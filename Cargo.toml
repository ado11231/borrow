[workspace]
members = ["crates/*"]
resolver = "3"

# Share dependency versions across the workspace.
[workspace.dependencies]
ignore = "0.4.33"
indicatif = "0.18.6"
iroh = { version = "1.2.0", default-features = false, features = ["tls-ring", "portmapper", "fast-apple-datapath"] }
sha2 = "0.11.0"
crossterm = "0.29.0"
libc = "0.2.189"
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shell-words = "1.1.0"
sysinfo = "0.39.6"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "signal", "net", "time", "sync"] }
toml = "1.1.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
