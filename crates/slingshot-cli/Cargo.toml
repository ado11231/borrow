[package]
name = "slingshot-cli"
version = "0.1.0"
edition = "2024"

# The package is slingshot-cli, but the program it produces is called slingshot.
[[bin]]
name = "slingshot"
path = "src/main.rs"

[dependencies]
slingshot-core = { path = "../slingshot-core" }
slingshot-agent = { path = "../slingshot-agent" }
anyhow = { workspace = true }
iroh = { workspace = true }
clap = { workspace = true }
crossterm = { workspace = true }
directories = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shell-words = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
