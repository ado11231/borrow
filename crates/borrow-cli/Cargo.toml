[package]
name = "borrow-cli"
version = "0.1.0"
edition = "2024"

# The package is borrow-cli, but the program it produces is called borrow.
[[bin]]
name = "borrow"
path = "src/main.rs"

[dependencies]
borrow-core = { path = "../borrow-core" }
borrow-agent = { path = "../borrow-agent" }
anyhow = { workspace = true }
clap = { workspace = true }
directories = { workspace = true }
serde_json = { workspace = true }
shell-words = { workspace = true }
sysinfo = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
