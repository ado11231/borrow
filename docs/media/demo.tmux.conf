# The split screen for demo.tape: the Agent on top, the Client below. The prefix is Ctrl A,
# so Ctrl B reaches the Slingshot session inside the bottom pane.
set -g prefix C-a
unbind C-b
set -g status off
set -g mouse off
set -g default-terminal "tmux-256color"
set -g allow-set-title off
set -g pane-border-status top
set -g pane-border-format " #{pane_title} "
set -g pane-border-style "fg=#585b70"
set -g pane-active-border-style "fg=#89b4fa"
